<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng nhập - Skibidi Quiz 9A</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(135deg,#1e293b,#0f172a); font-family:sans-serif; margin:0; }
    .login-box { background:white; padding:50px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.25); width:500px; text-align:center; }
    .login-box h2 { font-size:36px; font-weight:800; margin-bottom:30px; color:#111827; }
    .login-box input { width:100%; padding:16px 14px; margin:15px 0; border-radius:10px; border:1px solid #bbb; font-size:18px; }
    .login-box button { width:100%; padding:14px; border:none; border-radius:10px; background:linear-gradient(90deg,#9333ea,#ec4899); color:white; font-size:18px; font-weight:bold; cursor:pointer; transition:0.3s; }
    .login-box button:hover { opacity:0.9; transform:scale(1.02); }
    .back-link, .register-link { display:block; margin-top:12px; font-size:16px; text-decoration:none; }
    .back-link { color:#2563eb; }
    .register-link { color:#16a34a; font-weight:600; }
    .back-link:hover, .register-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Đăng nhập</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Tên đăng nhập" required />
      <input type="password" id="password" placeholder="Mật khẩu" required />
      <button type="submit">Đăng nhập</button>
    </form>
    <a href="trangchu.html" class="back-link">← Quay lại trang chủ</a>
    <a href="register.html" class="register-link">Chưa có tài khoản? Đăng ký</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function(e){
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      const users = JSON.parse(localStorage.getItem('users')) || {};

      if(!users[username]) {
        alert("Tên đăng nhập không tồn tại!");
        return;
      }

      if(users[username].password !== password) {
        alert("Mật khẩu không đúng!");
        return;
      }

      // Lưu người dùng đang đăng nhập
      localStorage.setItem('currentUser', username);

      alert("Đăng nhập thành công!");
      window.location.href = "trangchu.html";
    });
  </script>
</body>
</html>
